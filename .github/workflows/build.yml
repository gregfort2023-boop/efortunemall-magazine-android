name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Set version code
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Build release bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          jarsigner -keystore upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 android/app/build/outputs/bundle/release/app-release.aab upload
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: magazine-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
